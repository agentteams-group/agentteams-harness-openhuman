name: OpenHuman native arm64 artifact validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openhuman-native-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-artifact:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check isolated runner resources
        run: |
          uname -a
          free -m
          df -h
          test "$(uname -m)" = aarch64
          test "$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')" -ge 14680064
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 10485760
      - uses: actions/checkout@v4
      - name: Read exact shared Core dependency
        id: core
        run: echo "ref=$(sed -n 's/^AT_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ steps.core.outputs.ref }}
          path: agentteams
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.0'
      - name: Run normal Harness and native binding tests
        run: |
          python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
          AT_SOURCE="$GITHUB_WORKSPACE/agentteams" python -m pytest tests -q -p no:cacheprovider
          cargo test --locked --manifest-path tests/session-receipts/Cargo.toml
          AT_SOURCE="$GITHUB_WORKSPACE/agentteams" cargo test --locked --manifest-path tests/task-protocol/Cargo.toml
          bash -n scripts/openhuman-worker-entrypoint.sh scripts/agt
      - uses: docker/setup-buildx-action@v3
      - name: Build frozen native SDK with one compiler job
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('Dockerfile').read_text()
          old = 'GGML_NATIVE=OFF cargo build --release --bin openhuman-core --features channel-matrix'
          assert text.count(old) == 1
          text = text.replace(old, 'GGML_NATIVE=OFF CARGO_BUILD_JOBS=1 CARGO_PROFILE_RELEASE_DEBUG=0 cargo build --release --bin openhuman-core --features channel-matrix')
          Path('.native-artifact.Dockerfile').write_text(text)
          PY
          docker buildx build --load --platform linux/arm64 --target builder -f .native-artifact.Dockerfile -t openhuman-native-artifact:local .
      - name: Export exact binary and provenance
        run: |
          mkdir artifact
          container=$(docker create openhuman-native-artifact:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/openhuman-core" artifact/openhuman-core
          git rev-parse HEAD > artifact/harness.sha
          git -C agentteams rev-parse HEAD > artifact/core.sha
          cp versions.env artifact/
          docker run --rm --entrypoint sh openhuman-native-artifact:local -c 'git -C /build/openhuman-src rev-parse HEAD; rustc -Vv; dpkg-query -W; ldd /usr/local/bin/openhuman-core' > artifact/build-dependencies.txt
          docker inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' openhuman-native-artifact:local > artifact/image.txt
          sha256sum patches/task-protocol.patch patches/task_protocol.rs patches/task_telemetry.rs .native-artifact.Dockerfile > artifact/build-inputs.sha256
          (cd artifact && sha256sum openhuman-core > SHA256SUMS)
          file artifact/openhuman-core
          docker run --rm --network none --entrypoint /usr/local/bin/openhuman-core openhuman-native-artifact:local --help > artifact/native-help.txt
          df -h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openhuman-native-arm64-test-binary
          path: artifact/
          retention-days: 3
          if-no-files-found: warn
