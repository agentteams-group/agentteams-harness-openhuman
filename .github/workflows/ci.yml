name: OpenHuman Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_native_binary:
        description: Save the native executable for an isolated runtime-recovery run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GGML_NATIVE: 'OFF'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      AT_SOURCE: ${{ github.workspace }}/agentteams
    steps:
      - uses: actions/checkout@v4
      - name: Read shared Core dependency
        id: core
        run: |
          echo "ref=$(sed -n 's/^AT_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"
          echo "native_ref=$(sed -n 's/^OPENHUMAN_GIT_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ steps.core.outputs.ref }}
          path: agentteams
      - uses: actions/checkout@v4
        with:
          repository: tinyhumansai/openhuman
          ref: ${{ steps.core.outputs.native_ref }}
          path: native
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install native runtime build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libssl-dev libxdo-dev libxtst-dev libx11-dev libevdev-dev cmake clang pkg-config
      - name: Verify Task tool configuration and receipt guards
        run: |
          python3 -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
          AT_SOURCE="$GITHUB_WORKSPACE/agentteams" python3 -m pytest -q tests
          cargo test --locked --manifest-path tests/session-receipts/Cargo.toml
          cargo test --locked --manifest-path tests/task-protocol/Cargo.toml
          bash -n scripts/openhuman-worker-entrypoint.sh scripts/agt
      - name: Apply the packaged patches
        run: |
          cp patches/session_receipts.rs native/src/openhuman/channels/session_receipts.rs
          cp patches/task_coordination.rs native/src/openhuman/channels/task_coordination.rs
          cp patches/task_recovery.rs native/src/openhuman/channels/task_recovery.rs
          mkdir -p native/src/openhuman/channels/providers/matrix
          cp patches/worker_matrix.rs native/src/openhuman/channels/providers/matrix/worker_sync.rs
          cp patches/task_protocol.rs native/src/openhuman/channels/task_protocol.rs
          cp patches/task_telemetry.rs native/src/openhuman/channels/task_telemetry.rs
          sudo mkdir -p /opt/agentteams/scripts/lib
          sudo cp agentteams/shared/lib/*.py /opt/agentteams/scripts/lib/
          git -C native apply "$GITHUB_WORKSPACE/patches/agentteams.patch"
      - name: Verify native Matrix controls and tool cleanup
        working-directory: native
        run: |
          cargo test --locked --no-default-features --features channel-matrix --test agentteams_direct_control --test agentteams_task_recovery
          cargo test --locked --lib --no-default-features --features channel-matrix agentteams_native_task_protocol_ -- --test-threads=1
          cargo test --locked --lib --no-default-features --features channel-matrix agentteams_native_steer_
          cargo test --locked --lib --no-default-features --features channel-matrix channels::task_recovery::tests
          cargo test --locked --lib --no-default-features --features channel-matrix channels::session_receipts::tests
          cargo test --locked --lib --no-default-features --features channel-matrix channels::matrix_direct::tests
          cargo test --locked --lib --no-default-features --features channel-matrix approval::matrix::tests

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read shared Core dependency
        id: core
        run: echo "ref=$(sed -n 's/^AT_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ steps.core.outputs.ref }}
          path: agentteams
      - uses: docker/setup-buildx-action@v3
      - run: make build VERSION=ci AT_CONTEXT=./agentteams
      - run: make smoke VERSION=ci

      - name: Export native executable and build provenance
        if: github.event_name == 'workflow_dispatch' && inputs.export_native_binary
        run: |
          mkdir test-binary
          image=ghcr.io/agentteams-group/agentteams-harness-openhuman:ci
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/openhuman-core" test-binary/openhuman-core
          docker cp "$container:/usr/share/licenses/openhuman/LICENSE" test-binary/LICENSE
          git rev-parse HEAD > test-binary/harness.sha
          git -C agentteams rev-parse HEAD > test-binary/core.sha
          cp versions.env test-binary/
          docker inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' "$image" > test-binary/image.txt
          docker run --rm --entrypoint sh "$image" -c 'dpkg-query -W && ldd /usr/local/bin/openhuman-core' > test-binary/dependencies.txt
          (cd test-binary && sha256sum openhuman-core > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.export_native_binary
        with:
          name: openhuman-native-test-binary
          path: test-binary/
          retention-days: 1
          if-no-files-found: error
